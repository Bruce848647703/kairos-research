[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-research"
version = "0.1.0"
description = "Kairos Research —— 综合 Kairos 系列真实数据实验结果的研究结论报告集（文档/分析仓库）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bruce848647703" }]
keywords = ["quant", "research", "factor", "risk", "backtest", "documentation"]
# 文档/分析仓库，无重依赖：测试用 pandas 读汇总表，scripts/robustness.py 用 numpy+pandas
# 离线交叉兄弟仓库的四维产物（只读）。
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
# 本仓库不含可导入的 Python 包，仅文档、数据与离线测试。
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
